<svg width="100%" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Estevão Lopes - Full Stack Developer pixel art animation</title>
  <desc>Pixel art of a developer coding at a computer with floating tech symbols</desc>

  <style>
    .cursor { animation: cursor 0.8s steps(1) infinite; }
    @keyframes cursor { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    .float1 { animation: floatUp 3.2s ease-in-out infinite; }
    .float2 { animation: floatUp 3.2s ease-in-out infinite 1s; }
    .float3 { animation: floatUp 3.2s ease-in-out infinite 2s; }
    @keyframes floatUp {
      0%   { transform: translateY(0px); opacity:0; }
      15%  { opacity:1; } 85%  { opacity:1; }
      100% { transform: translateY(-56px); opacity:0; }
    }
    .typing { animation: typingAnim 1.8s steps(1) infinite; }
    @keyframes typingAnim {
      0%,100% { transform: translateX(0); }
      33%     { transform: translateX(3px); }
      66%     { transform: translateX(6px); }
    }
    .led { animation: ledPulse 1.4s ease-in-out infinite; }
    @keyframes ledPulse { 0%,100%{opacity:1} 50%{opacity:0.25} }
    .scanline { animation: scan 2.8s linear infinite; }
    @keyframes scan {
      0%   { transform: translateY(0);    opacity:0.13; }
      100% { transform: translateY(60px); opacity:0.13; }
    }
    .steam1 { animation: steam 2s ease-out infinite; }
    .steam2 { animation: steam 2s ease-out infinite 0.7s; }
    @keyframes steam {
      0%   { transform: translateY(0);     opacity:0.5; }
      100% { transform: translateY(-10px); opacity:0; }
    }
  </style>

  <!-- background -->
  <rect x="0" y="0" width="680" height="200" fill="#0d1117" rx="12"/>

  <!-- grid dots -->
  <g fill="#1c2333">
    <rect x="18" y="18" width="3" height="3" rx="1"/><rect x="38" y="18" width="3" height="3" rx="1"/>
    <rect x="58" y="18" width="3" height="3" rx="1"/><rect x="78" y="18" width="3" height="3" rx="1"/>
    <rect x="18" y="38" width="3" height="3" rx="1"/><rect x="38" y="38" width="3" height="3" rx="1"/>
    <rect x="18" y="58" width="3" height="3" rx="1"/><rect x="38" y="58" width="3" height="3" rx="1"/>
    <rect x="18" y="148" width="3" height="3" rx="1"/><rect x="38" y="148" width="3" height="3" rx="1"/>
    <rect x="18" y="168" width="3" height="3" rx="1"/><rect x="38" y="168" width="3" height="3" rx="1"/>
    <rect x="598" y="18" width="3" height="3" rx="1"/><rect x="618" y="18" width="3" height="3" rx="1"/>
    <rect x="638" y="18" width="3" height="3" rx="1"/><rect x="658" y="18" width="3" height="3" rx="1"/>
    <rect x="598" y="38" width="3" height="3" rx="1"/><rect x="618" y="38" width="3" height="3" rx="1"/>
    <rect x="598" y="58" width="3" height="3" rx="1"/><rect x="618" y="58" width="3" height="3" rx="1"/>
    <rect x="598" y="148" width="3" height="3" rx="1"/><rect x="618" y="148" width="3" height="3" rx="1"/>
    <rect x="598" y="168" width="3" height="3" rx="1"/><rect x="618" y="168" width="3" height="3" rx="1"/>
  </g>

  <!-- ── MONITOR ── -->
  <rect x="285" y="168" width="110" height="8" rx="3" fill="#21262d"/>
  <rect x="332" y="148" width="16" height="22" rx="2" fill="#21262d"/>
  <rect x="228" y="62" width="224" height="90" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="237" y="70" width="206" height="74" rx="4" fill="#010409"/>
