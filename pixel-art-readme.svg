  <rect class="led" x="333" y="148" width="14" height="5" rx="2" fill="#56d364"/>

  <!-- ── FLOATING SYMBOLS ── -->
  <g class="float1" transform="translate(162,88)">
    <rect x="0" y="0" width="30" height="28" rx="4" fill="#1c2333" stroke="#30363d" stroke-width="1"/>
    <text x="15" y="20" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#79c0ff">{ }</text>
  </g>
  <g class="float2" transform="translate(478,98)">
    <rect x="0" y="0" width="34" height="28" rx="4" fill="#1c2333" stroke="#30363d" stroke-width="1"/>
    <text x="17" y="20" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#56d364">/&gt;</text>
