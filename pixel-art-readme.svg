  <rect x="176" y="87" width="6" height="2" rx="1" fill="#1a1a1a"/>

  <!-- nariz -->
  <rect x="162" y="93" width="4" height="3" rx="1" fill="#9c6128"/>

  <!-- boca / sorriso -->
  <rect x="154" y="98" width="5" height="2" rx="1" fill="#8b4f1e"/>
  <rect x="159" y="100" width="8" height="2" rx="1" fill="#8b4f1e"/>
  <rect x="167" y="98" width="5" height="2" rx="1" fill="#8b4f1e"/>

  <!-- pescoço -->
  <rect x="157" y="104" width="12" height="8" rx="1" fill="#b5783a"/>

  <!-- corpo -->
  <rect x="136" y="112" width="54" height="44" rx="4" fill="#1f6feb"/>
  <!-- gola -->
