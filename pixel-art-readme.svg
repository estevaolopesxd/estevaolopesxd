  <rect x="340" y="78" width="22" height="3" rx="1" fill="#56d364"/>
  <rect x="253" y="87" width="38" height="3" rx="1" fill="#79c0ff"/>
  <rect x="297" y="87" width="48" height="3" rx="1" fill="#e3b341"/>
  <rect x="351" y="87" width="18" height="3" rx="1" fill="#a5d6ff"/>
  <rect x="253" y="96" width="76" height="3" rx="1" fill="#56d364"/>
